<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Birraverde</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .register-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: cardFadeIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .register-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise"></div>

    <nav>
        <div class="container">
            <a href="/" class="logo">
                <img src="/birraverde.png" alt="Birraverde">
            </a>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/servicios/">Servicios</a></li>
                <li><a href="/sello/">Sello</a></li>
                <li><a href="/sala/">Reservar Sala</a></li>
            </ul>
            <a href="/" class="btn btn-outline" style="padding: 0.5rem 1.5rem">Volver</a>
        </div>
    </nav>

    <main class="section">
        <div class="container register-container">
            <div class="register-card">
                <h2 style="margin-bottom: 0.5rem; text-align: center;">Crear Cuenta</h2>
                <p style="color: var(--text-muted); text-align: center; margin-bottom: 2.5rem; font-size: 0.95rem;">
                    Regístrate para agendar y gestionar tus sesiones.
                </p>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="name">Nombre Completo / Artista</label>
                        <input type="text" id="name" name="name" placeholder="Ej: Travis Scott" required autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
                    </div>

                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
                    </div>

                    <div id="error-message" style="color: #ff4444; font-size: 0.9rem; margin-bottom: 1.5rem; display: none; text-align: center; background: rgba(255, 68, 68, 0.08); padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255, 68, 68, 0.2);"></div>

                    <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 1.5rem;">
                        Registrarse
                    </button>

                    <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                        ¿Ya tienes una cuenta? <a href="/login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Inicia Sesión</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Si ya está logueado, redirigir
            if (localStorage.getItem('birraverde_token')) {
                window.location.href = '/perfil/';
            }

            const form = document.getElementById('registerForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('error-message');

            form.onsubmit = async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.innerText = 'Cargando...';
                errorMessage.style.display = 'none';

                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert('✅ Registro exitoso. Ahora puedes iniciar sesión.');
                        window.location.href = '/login.html';
                    } else {
                        errorMessage.innerText = data.error || 'Error al registrarse.';
                        errorMessage.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.innerText = 'Registrarse';
                    }
                } catch (err) {
                    errorMessage.innerText = 'Error de conexión con el servidor.';
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Registrarse';
                }
            };
        });
    </script>
</body>
</html>
