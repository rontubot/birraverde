<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establecer Nueva Contraseña | Birraverde</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .reset-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: cardFadeIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reset-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise"></div>

    <nav>
        <div class="container">
            <a href="/" class="logo">
                <img src="/birraverde.png" alt="Birraverde">
            </a>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/servicios/">Servicios</a></li>
                <li><a href="/sello/">Sello</a></li>
                <li><a href="/sala/">Reservar Sala</a></li>
            </ul>
        </div>
    </nav>

    <main class="section">
        <div class="container reset-container">
            <div class="reset-card">
                <h2 style="margin-bottom: 0.5rem; text-align: center;">Nueva Contraseña</h2>
                <p style="color: var(--text-muted); text-align: center; margin-bottom: 2.5rem; font-size: 0.95rem;">
                    Ingresa tu nueva contraseña para acceder a tu cuenta.
                </p>

                <form id="resetForm">
                    <div class="form-group">
                        <label for="password">Nueva Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
                    </div>

                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label for="confirmPassword">Confirmar Nueva Contraseña</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" required autocomplete="new-password" minlength="6">
                    </div>

                    <div id="status-message" style="font-size: 0.95rem; margin-bottom: 1.5rem; display: none; text-align: center; padding: 0.75rem; border-radius: 8px;"></div>

                    <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 1.5rem;">
                        Restablecer Contraseña
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('resetForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('status-message');

            // Obtener el token de los parámetros URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                statusMessage.innerText = '⚠️ Token de recuperación ausente o no válido.';
                statusMessage.style.background = 'rgba(255, 68, 68, 0.08)';
                statusMessage.style.color = '#ff4444';
                statusMessage.style.border = '1px solid rgba(255, 68, 68, 0.2)';
                statusMessage.style.display = 'block';
                submitBtn.disabled = true;
                return;
            }

            form.onsubmit = async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.innerText = 'Cargando...';
                statusMessage.style.display = 'none';

                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    statusMessage.innerText = '⚠️ Las contraseñas no coinciden.';
                    statusMessage.style.background = 'rgba(255, 68, 68, 0.08)';
                    statusMessage.style.color = '#ff4444';
                    statusMessage.style.border = '1px solid rgba(255, 68, 68, 0.2)';
                    statusMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Restablecer Contraseña';
                    return;
                }

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        statusMessage.innerText = '✅ Contraseña restablecida con éxito. Redirigiendo...';
                        statusMessage.style.background = 'rgba(0, 255, 65, 0.08)';
                        statusMessage.style.color = 'var(--primary)';
                        statusMessage.style.border = '1px solid rgba(0, 255, 65, 0.2)';
                        statusMessage.style.display = 'block';
                        
                        setTimeout(() => {
                            window.location.href = '/login.html';
                        }, 2500);
                    } else {
                        statusMessage.innerText = '⚠️ ' + (data.error || 'Error al restablecer la contraseña.');
                        statusMessage.style.background = 'rgba(255, 68, 68, 0.08)';
                        statusMessage.style.color = '#ff4444';
                        statusMessage.style.border = '1px solid rgba(255, 68, 68, 0.2)';
                        statusMessage.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.innerText = 'Restablecer Contraseña';
                    }
                } catch (err) {
                    statusMessage.innerText = '⚠️ Error de conexión con el servidor.';
                    statusMessage.style.background = 'rgba(255, 68, 68, 0.08)';
                    statusMessage.style.color = '#ff4444';
                    statusMessage.style.border = '1px solid rgba(255, 68, 68, 0.2)';
                    statusMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Restablecer Contraseña';
                }
            };
        });
    </script>
</body>
</html>
