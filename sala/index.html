<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Sala | Birraverde</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise"></div>

    <nav>
        <div class="container">
            <a href="/" class="logo">
                <img src="/birraverde.png" alt="Birraverde">
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="/">Inicio</a></li>
                <li><a href="/servicios/">Servicios</a></li>
                <li><a href="/sello/">Sello</a></li>
                <li><a href="/sala/" style="color: var(--primary);">Sala</a></li>
            </ul>
            <a href="/" class="btn btn-outline" style="padding: 0.5rem 1.5rem">Volver al Inicio</a>
            <button class="hamburger" id="hamburger" aria-label="Menú">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-overlay" id="navOverlay"></div>

    <main class="section">
        <div class="container">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem;">
                <div class="reveal">
                    <div class="booking-section" style="padding: 2rem;">
                        <h3 style="margin-bottom: 2rem;">Disponibilidad de Sala</h3>
                        <div id="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <button id="prevMonth" class="btn btn-outline" style="padding: 0.5rem 1rem;">&lt;</button>
                            <h4 id="currentMonthYear"></h4>
                            <button id="nextMonth" class="btn btn-outline" style="padding: 0.5rem 1rem;">&gt;</button>
                        </div>
                        <div id="calendar-days" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
                            <div>Dom</div><div>Lun</div><div>Mar</div><div>Mie</div><div>Jue</div><div>Vie</div><div>Sab</div>
                        </div>
                        <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 0.5rem;">
                        </div>

                        <div id="time-grid-container" style="margin-top: 3rem; display: none;">
                            <h4 id="selected-date-label" style="margin-bottom: 1.5rem; color: var(--primary);"></h4>
                            <div id="time-slots" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px;">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="reveal">
                    <div class="booking-section">
                        <h2 style="margin-bottom: 1rem;">Solicitud de Reserva</h2>
                        <p style="color: var(--text-muted); margin-bottom: 3rem;">Completa los detalles para agendar tu sesión.</p>
                        
                        <form id="bookingForm">
                            <input type="hidden" id="selectedDate" name="date" required>
                            <input type="hidden" id="selectedTime" name="time" required>

                            <div class="form-group">
                                <label for="name">Nombre del Artista / Cliente</label>
                                <input type="text" id="name" name="name" placeholder="Ej: Travis Scott" required>
                            </div>

                             <div class="form-group">
                                 <label for="email">Correo Electrónico</label>
                                 <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                             </div>
 
                             <div class="form-group">
                                 <label for="phone">Teléfono / WhatsApp</label>
                                 <input type="tel" id="phone" name="phone" placeholder="+54 9 ..." required>
                             </div>
 

 
                             <div class="form-group">
                                 <label for="people">Número de Personas</label>
                                 <input type="number" id="people" name="people" min="1" max="50" placeholder="Ej: 5" required>
                             </div>

                            <div class="form-group">
                                <label for="duration">Duración (Horas)</label>
                                <select id="duration" name="duration" required>
                                    <option value="1">1 Hora</option>
                                    <option value="2" selected>2 Horas</option>
                                    <option value="4">4 Horas</option>
                                    <option value="8">Jornada Completa (8h)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="notes">Mensaje (Opcional)</label>
                                <textarea id="notes" name="notes" rows="3" placeholder="Equipos, iluminación, o cualquier detalle adicional..."></textarea>
                            </div>

                            <div id="error-message" style="color: #ff4444; font-size: 0.9rem; margin-bottom: 1rem; display: none;"></div>

                            <div id="success-message" style="color: #00ff41; font-size: 0.9rem; margin-bottom: 1rem; display: none; background: rgba(0,255,65,0.08); padding: 1rem; border-radius: 12px; border: 1px solid rgba(0,255,65,0.2);">
                                ✅ ¡Reserva registrada! Revisa tu correo (si tarda, es por el servidor).
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;" disabled>
                                <span id="btnText">Confirmar Reserva</span>
                                <span id="btnLoading" style="display:none;">Enviando...</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="recentBookings" class="reveal" style="margin-top: 4rem; display: none;">
                <h3 style="margin-bottom: 2rem;">Tus Reservas Recientes</h3>
                <div id="bookingsList" style="display: flex; flex-direction: column; gap: 1rem;">
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const calendarGrid = document.getElementById('calendar-grid');
            const monthYearLabel = document.getElementById('currentMonthYear');
            const timeGridContainer = document.getElementById('time-grid-container');
            const timeSlotsGrid = document.getElementById('time-slots');
            const dateLabel = document.getElementById('selected-date-label');
            const form = document.getElementById('bookingForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('error-message');

            let currentDate = new Date();
            let selectedDay = null;
            let serverBookings = [];

            const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const timeToMinutes = (t) => {
                const [h, m] = t.split(':').map(Number);
                return h * 60 + m;
            };

            const fetchServerBookings = async () => {
                try {
                    const response = await fetch('/api/bookings');
                    if (response.ok) {
                        serverBookings = await response.json();
                        if (selectedDay) {
                            const y = currentDate.getFullYear();
                            const m = currentDate.getMonth();
                            const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(selectedDay).padStart(2, '0')}`;
                            renderTimeSlots(ds);
                        }
                    }
                } catch (e) { console.error(e); }
            };

            const renderCalendar = () => {
                calendarGrid.innerHTML = '';
                const y = currentDate.getFullYear();
                const m = currentDate.getMonth();
                monthYearLabel.innerText = `${months[m]} ${y}`;
                const firstDay = new Date(y, m, 1).getDay();
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                for (let i = 0; i < firstDay; i++) calendarGrid.innerHTML += '<div></div>';
                for (let i = 1; i <= daysInMonth; i++) {
                    const dEl = document.createElement('div');
                    dEl.innerText = i;
                    dEl.style.cssText = 'padding: 10px; cursor: pointer; border-radius: 8px; transition: 0.3s; background: var(--glass); border: 1px solid var(--glass-border); text-align: center;';
                    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    dEl.onclick = () => selectDate(i, ds);
                    if (selectedDay === i) { dEl.style.background = 'var(--primary)'; dEl.style.color = '#000'; }
                    calendarGrid.appendChild(dEl);
                }
            };

            const selectDate = (day, ds) => {
                selectedDay = day;
                document.getElementById('selectedDate').value = ds;
                renderCalendar();
                timeGridContainer.style.display = 'block';
                dateLabel.innerText = `Horarios para el ${day} de ${months[currentDate.getMonth()]}`;
                renderTimeSlots(ds);
            };

            const renderTimeSlots = (ds) => {
                timeSlotsGrid.innerHTML = '';
                const local = JSON.parse(localStorage.getItem('birraverde_bookings') || '[]');
                const all = [...serverBookings, ...local];
                
                for (let h = 8; h <= 20; h++) {
                    const t = `${String(h).padStart(2, '0')}:00`;
                    const currentMins = timeToMinutes(t);
                    
                    // Check if this specific hour falls into ANY existing booking's range
                    const isOccupied = all.some(b => {
                        if (b.date !== ds) return false;
                        const start = timeToMinutes(b.time);
                        const end = start + (Number(b.duration) * 60);
                        return currentMins >= start && currentMins < end;
                    });
                    
                    const slot = document.createElement('div');
                    slot.innerText = t;
                    slot.style.cssText = `padding: 12px; text-align: center; border-radius: 8px; font-size: 0.9rem; border: 1px solid var(--glass-border); cursor: ${isOccupied ? 'not-allowed' : 'pointer'}; opacity: ${isOccupied ? '0.3' : '1'}; background: ${isOccupied ? '#333' : 'var(--glass)'};`;
                    if (!isOccupied) {
                        slot.classList.add('time-slot-available');
                        slot.onclick = () => selectTime(t, slot);
                    } else {
                        const l = document.createElement('span');
                        l.innerText = ' (Ocupado)';
                        l.style.fontSize = '0.6rem';
                        l.style.display = 'block';
                        slot.appendChild(l);
                    }
                    timeSlotsGrid.appendChild(slot);
                }
            };

            window.selectTime = (t, el) => {
                document.querySelectorAll('.time-slot-available').forEach(e => { e.style.background = 'var(--glass)'; e.style.color = '#fff'; });
                el.style.background = 'var(--primary)';
                el.style.color = '#000';
                document.getElementById('selectedTime').value = t;
                submitBtn.disabled = false;
                errorMessage.style.display = 'none';
            };

            document.getElementById('prevMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); selectedDay = null; renderCalendar(); };
            document.getElementById('nextMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); selectedDay = null; renderCalendar(); };

            form.onsubmit = async (e) => {
                e.preventDefault();
                const fd = new FormData(form);
                const b = Object.fromEntries(fd.entries());
                const bt = document.getElementById('btnText');
                const bl = document.getElementById('btnLoading');
                const sm = document.getElementById('success-message');
                submitBtn.disabled = true; bt.style.display = 'none'; bl.style.display = 'inline';
                errorMessage.style.display = 'none'; sm.style.display = 'none';

                try {
                    const res = await fetch('/api/booking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
                    const resJ = await res.json();
                    if (res.ok) {
                        const local = JSON.parse(localStorage.getItem('birraverde_bookings') || '[]');
                        local.unshift(b);
                        localStorage.setItem('birraverde_bookings', JSON.stringify(local));
                        sm.style.display = 'block';
                        form.reset(); loadRecent(); selectedDay = null; renderCalendar(); timeGridContainer.style.display = 'none';
                        fetchServerBookings();
                    } else {
                        errorMessage.innerText = `⚠️ ${resJ.error || 'Error'}`;
                        errorMessage.style.display = 'block';
                    }
                } catch (err) {
                    errorMessage.innerText = '⚠️ Error de conexión.';
                    errorMessage.style.display = 'block';
                } finally {
                    bt.style.display = 'inline'; bl.style.display = 'none'; submitBtn.disabled = false;
                }
            };

            const loadRecent = () => {
                const local = JSON.parse(localStorage.getItem('birraverde_bookings') || '[]');
                if (local.length > 0) {
                    document.getElementById('recentBookings').style.display = 'block';
                    document.getElementById('bookingsList').innerHTML = local.map(b => `
                        <div style="background: var(--bg-card); border: 1px solid var(--glass-border); padding: 1.5rem; border-radius: 16px; display: flex; justify-content: space-between; align-items: center;">
                            <div><strong style="color: var(--primary); font-size: 1.1rem;">${b.name}</strong><p style="color: var(--text-muted); font-size: 0.9rem;">${b.duration} hora(s)</p></div>
                            <div style="text-align: right;"><span style="display: block; font-weight: 600;">${b.date}</span><span style="color: var(--primary);">${b.time}</span></div>
                        </div>`).join('');
                }
            };

            renderCalendar(); loadRecent(); fetchServerBookings();
            if (typeof gsap !== 'undefined') { gsap.to('.reveal', { opacity: 1, y: 0, duration: 1, stagger: 0.2, ease: 'power3.out' }); }
        });

        const hb = document.getElementById('hamburger');
        const nl = document.getElementById('navLinks');
        const no = document.getElementById('navOverlay');
        if (hb) {
            hb.onclick = () => { hb.classList.toggle('active'); nl.classList.toggle('open'); no.classList.toggle('active'); };
            no.onclick = () => { hb.classList.remove('active'); nl.classList.remove('open'); no.classList.remove('active'); };
        }
    </script>
</body>
</html>
