<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Sala | Birraverde</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise"></div>

    <nav>
        <div class="container">
            <a href="/" class="logo">Birraverde</a>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/servicios/">Servicios</a></li>
                <li><a href="/sello/">Sello</a></li>
            </ul>
            <a href="/" class="btn btn-outline" style="padding: 0.5rem 1.5rem">Volver al Inicio</a>
        </div>
    </nav>

    <main class="section">
        <div class="container">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 3rem;">
                <!-- Left Side: Calendar & Time Grid -->
                <div class="reveal">
                    <div class="booking-section" style="padding: 2rem;">
                        <h3 style="margin-bottom: 2rem;">Disponibilidad de Sala</h3>
                        <div id="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <button id="prevMonth" class="btn btn-outline" style="padding: 0.5rem 1rem;">&lt;</button>
                            <h4 id="currentMonthYear"></h4>
                            <button id="nextMonth" class="btn btn-outline" style="padding: 0.5rem 1rem;">&gt;</button>
                        </div>
                        <div id="calendar-days" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
                            <div>Dom</div><div>Lun</div><div>Mar</div><div>Mie</div><div>Jue</div><div>Vie</div><div>Sab</div>
                        </div>
                        <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 0.5rem;">
                        </div>

                        <div id="time-grid-container" style="margin-top: 3rem; display: none;">
                            <h4 id="selected-date-label" style="margin-bottom: 1.5rem; color: var(--primary);"></h4>
                            <div id="time-slots" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Side: Booking Form -->
                <div class="reveal">
                    <div class="booking-section">
                        <h2 style="margin-bottom: 1rem;">Solicitud de Reserva</h2>
                        <p style="color: var(--text-muted); margin-bottom: 3rem;">Completa los detalles para agendar tu sesión.</p>
                        
                        <form id="bookingForm">
                            <input type="hidden" id="selectedDate" name="date" required>
                            <input type="hidden" id="selectedTime" name="time" required>

                            <div class="form-group">
                                <label for="name">Nombre del Artista / Cliente</label>
                                <input type="text" id="name" name="name" placeholder="Ej: Travis Scott" required>
                            </div>

                            <div class="form-group">
                                <label for="type">Tipo de Sesión</label>
                                <select id="type" name="type" required>
                                    <option value="Video Clip">Video Clip</option>
                                    <option value="Contenido Redes">Contenido Redes</option>
                                    <option value="Sesión Branding">Sesión Branding</option>
                                    <option value="Reunión Sello">Reunión Sello</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="duration">Duración (Horas)</label>
                                <select id="duration" name="duration" required>
                                    <option value="1">1 Hora</option>
                                    <option value="2" selected>2 Horas</option>
                                    <option value="4">4 Horas</option>
                                    <option value="8">Jornada Completa (8h)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="notes">Mensaje (Opcional)</label>
                                <textarea id="notes" name="notes" rows="3" placeholder="Equipos, iluminación, o cualquier detalle adicional..."></textarea>
                            </div>

                            <div id="error-message" style="color: #ff4444; font-size: 0.9rem; margin-bottom: 1rem; display: none;">
                                ⚠️ El horario seleccionado ya está ocupado.
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;" disabled>Confirmar Reserva</button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="recentBookings" class="reveal" style="margin-top: 4rem; display: none;">
                <h3 style="margin-bottom: 2rem;">Reservas Agendadas</h3>
                <div id="bookingsList" style="display: flex; flex-direction: column; gap: 1rem;">
                </div>
            </div>
        </div>
    </main>

    <!-- Use CDN for GSAP to work without a server -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const calendarGrid = document.getElementById('calendar-grid');
            const monthYearLabel = document.getElementById('currentMonthYear');
            const timeGridContainer = document.getElementById('time-grid-container');
            const timeSlotsGrid = document.getElementById('time-slots');
            const dateLabel = document.getElementById('selected-date-label');
            const form = document.getElementById('bookingForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('error-message');

            let currentDate = new Date();
            let selectedDay = null;

            const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const renderCalendar = () => {
                calendarGrid.innerHTML = '';
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                
                monthYearLabel.innerText = `${months[month]} ${year}`;

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    calendarGrid.innerHTML += '<div></div>';
                }

                for (let i = 1; i <= daysInMonth; i++) {
                    const dayEl = document.createElement('div');
                    dayEl.innerText = i;
                    dayEl.style.cssText = 'padding: 10px; cursor: pointer; border-radius: 8px; transition: 0.3s; background: var(--glass); border: 1px solid var(--glass-border); text-align: center;';
                    
                    const dayString = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    
                    dayEl.onclick = () => selectDate(i, dayString);
                    
                    if (selectedDay === i) {
                        dayEl.style.background = 'var(--primary)';
                        dayEl.style.color = '#000';
                    }

                    calendarGrid.appendChild(dayEl);
                }
            };

            const selectDate = (day, dateString) => {
                selectedDay = day;
                document.getElementById('selectedDate').value = dateString;
                renderCalendar();
                
                timeGridContainer.style.display = 'block';
                dateLabel.innerText = `Horarios para el ${day} de ${months[currentDate.getMonth()]}`;
                renderTimeSlots(dateString);
            };

            const renderTimeSlots = (dateString) => {
                timeSlotsGrid.innerHTML = '';
                const bookings = JSON.parse(localStorage.getItem('birraverde_bookings') || '[]');
                
                for (let hour = 8; hour <= 20; hour++) {
                    const time = `${String(hour).padStart(2, '0')}:00`;
                    const isOccupied = bookings.some(b => b.date === dateString && b.time === time);
                    
                    const slot = document.createElement('div');
                    slot.innerText = time;
                    slot.style.cssText = `
                        padding: 12px; 
                        text-align: center; 
                        border-radius: 8px; 
                        font-size: 0.9rem;
                        border: 1px solid var(--glass-border);
                        cursor: ${isOccupied ? 'not-allowed' : 'pointer'};
                        opacity: ${isOccupied ? '0.3' : '1'};
                        background: ${isOccupied ? '#333' : 'var(--glass)'};
                    `;

                    if (!isOccupied) {
                        slot.classList.add('time-slot-available');
                        slot.onclick = () => selectTime(time, slot);
                    } else {
                        const label = document.createElement('span');
                        label.innerText = ' (Ocupado)';
                        label.style.fontSize = '0.6rem';
                        label.style.display = 'block';
                        slot.appendChild(label);
                    }

                    timeSlotsGrid.appendChild(slot);
                }
            };

            window.selectTime = (time, element) => {
                document.querySelectorAll('.time-slot-available').forEach(el => {
                    el.style.background = 'var(--glass)';
                    el.style.color = '#fff';
                });
                element.style.background = 'var(--primary)';
                element.style.color = '#000';
                document.getElementById('selectedTime').value = time;
                submitBtn.disabled = false;
                errorMessage.style.display = 'none';
            };

            document.getElementById('prevMonth').onclick = () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                selectedDay = null;
                renderCalendar();
            };

            document.getElementById('nextMonth').onclick = () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                selectedDay = null;
                renderCalendar();
            };

            form.onsubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const booking = Object.fromEntries(formData.entries());
                
                const bookings = JSON.parse(localStorage.getItem('birraverde_bookings') || '[]');
                const isOccupied = bookings.some(b => b.date === booking.date && b.time === booking.time);
                
                if (isOccupied) {
                    errorMessage.style.display = 'block';
                    return;
                }

                bookings.unshift(booking);
                localStorage.setItem('birraverde_bookings', JSON.stringify(bookings));
                
                alert('¡Reserva confirmada!');
                location.reload();
            };

            const loadRecent = () => {
                const bookings = JSON.parse(localStorage.getItem('birraverde_bookings') || '[]');
                if (bookings.length > 0) {
                    document.getElementById('recentBookings').style.display = 'block';
                    const list = document.getElementById('bookingsList');
                    list.innerHTML = bookings.map(b => `
                        <div style="background: var(--bg-card); border: 1px solid var(--glass-border); padding: 1.5rem; border-radius: 16px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong style="color: var(--primary); font-size: 1.1rem;">${b.name}</strong>
                                <p style="color: var(--text-muted); font-size: 0.9rem;">${b.type} - ${b.duration}h</p>
                            </div>
                            <div style="text-align: right;">
                                <span style="display: block; font-weight: 600;">${b.date}</span>
                                <span style="color: var(--primary);">${b.time}</span>
                            </div>
                        </div>
                    `).join('');
                }
            };

            renderCalendar();
            loadRecent();

            if (typeof gsap !== 'undefined') {
                gsap.to('.reveal', {
                    opacity: 1,
                    y: 0,
                    duration: 1,
                    stagger: 0.2,
                    ease: 'power3.out'
                });
            } else {
                // Fallback if GSAP doesn't load
                document.querySelectorAll('.reveal').forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'none';
                });
            }
        });
    </script>
</body>
</html>
