ltm rule /Common/Header_EDNS0_IPv4_AR {
when DNS_REQUEST {
  set fqdn_name .[DNS::question name]
  #log local0. "el fqdn es: $fqdn_name"
    if { [class match $fqdn_name ends_with CDNS_Query_Domains_AR] } {
      DNS::disable cache
      DNS::disable dnsx
      DNS::disable bind
      snat automap
      DNS::edns0 subnet address [IP::client_addr]
      DNS::edns0 subnet source 25
      DNS::last_act allow
      pool NS_Clarotv
   }
}
}
