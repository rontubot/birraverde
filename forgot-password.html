<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Birraverde</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .forgot-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: cardFadeIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .forgot-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise"></div>

    <nav>
        <div class="container">
            <a href="/" class="logo">
                <img src="/birraverde.png" alt="Birraverde">
            </a>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/servicios/">Servicios</a></li>
                <li><a href="/sello/">Sello</a></li>
                <li><a href="/sala/">Reservar Sala</a></li>
            </ul>
            <a href="/login.html" class="btn btn-outline" style="padding: 0.5rem 1.5rem">Volver al Login</a>
        </div>
    </nav>

    <main class="section">
        <div class="container forgot-container">
            <div class="forgot-card">
                <h2 style="margin-bottom: 0.5rem; text-align: center;">Recuperar Contraseña</h2>
                <p style="color: var(--text-muted); text-align: center; margin-bottom: 2.5rem; font-size: 0.95rem;">
                    Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
                </p>

                <form id="forgotForm">
                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
                    </div>

                    <div id="status-message" style="font-size: 0.95rem; margin-bottom: 1.5rem; display: none; text-align: center; padding: 0.75rem; border-radius: 8px;"></div>

                    <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 1.5rem;">
                        Enviar Enlace de Recuperación
                    </button>

                    <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                        ¿Te acordaste de tu contraseña? <a href="/login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Inicia Sesión</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <script src="/alerts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgotForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('status-message');

            form.onsubmit = async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.innerText = 'Enviando...';
                statusMessage.style.display = 'none';

                const email = document.getElementById('email').value;

                try {
                    const response = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        statusMessage.innerText = '✅ ' + (data.message || 'Se ha enviado un correo con instrucciones.');
                        statusMessage.style.background = 'rgba(0, 255, 65, 0.08)';
                        statusMessage.style.color = 'var(--primary)';
                        statusMessage.style.border = '1px solid rgba(0, 255, 65, 0.2)';
                        statusMessage.style.display = 'block';
                        form.reset();
                    } else {
                        statusMessage.innerText = '⚠️ ' + (data.error || 'Error al procesar la solicitud.');
                        statusMessage.style.background = 'rgba(255, 68, 68, 0.08)';
                        statusMessage.style.color = '#ff4444';
                        statusMessage.style.border = '1px solid rgba(255, 68, 68, 0.2)';
                        statusMessage.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.innerText = 'Enviar Enlace de Recuperación';
                    }
                } catch (err) {
                    statusMessage.innerText = '⚠️ Error de conexión con el servidor.';
                    statusMessage.style.background = 'rgba(255, 68, 68, 0.08)';
                    statusMessage.style.color = '#ff4444';
                    statusMessage.style.border = '1px solid rgba(255, 68, 68, 0.2)';
                    statusMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Enviar Enlace de Recuperación';
                }
            };
        });
    </script>
</body>
</html>
